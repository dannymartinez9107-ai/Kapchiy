<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kapchiy - Tienda Oficial</title>
  <style>
    :root {
      --primary: #111;
      --ws: #25D366;
      --ws-hover: #1eb954;
      --bg: #f8f9fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: #222; padding-bottom: 60px; }

    header { background: var(--primary); color: white; text-align: center; padding: 2rem 1rem; }
    header h1 { font-size: 2.2rem; letter-spacing: 2px; }

    .banner-container { max-width: 1200px; margin: 20px auto 0; padding: 0 15px; }
    .banner-img { width: 100%; max-height: 280px; object-fit: cover; border-radius: 8px; }

    .main-container { max-width: 1200px; margin: 25px auto; padding: 0 15px; display: grid; grid-template-columns: 1fr 340px; gap: 25px; }
    @media (max-width: 850px) { .main-container { grid-template-columns: 1fr; } }

    .catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
    .card { background: white; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card img { width: 100%; height: 210px; object-fit: cover; border-radius: 6px; background: #eee; }
    .card h3 { font-size: 1rem; margin: 8px 0 4px; }
    .card .price { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; }

    select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 8px; outline: none; }
    .btn-add { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
    .btn-add:hover { background: #333; }

    .cart { background: white; padding: 18px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); height: fit-content; position: sticky; top: 15px; }
    .cart h2 { border-bottom: 2px solid #eee; padding-bottom: 8px; margin-bottom: 12px; font-size: 1.2rem; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.88rem; border-bottom: 1px solid #f0f0f0; padding-bottom: 6px; }
    .btn-del { background: none; border: none; color: red; font-weight: bold; cursor: pointer; margin-left: 8px; }
    .cart-total { font-size: 1.15rem; font-weight: bold; display: flex; justify-content: space-between; border-top: 2px solid #eee; padding-top: 10px; margin: 12px 0; }

    form { display: flex; flex-direction: column; gap: 8px; }
    input { padding: 9px; border: 1px solid #ccc; border-radius: 4px; outline: none; font-size: 0.9rem; }
    .btn-ws { background: var(--ws); color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; font-size: 0.95rem; cursor: pointer; margin-top: 4px; }
    .btn-ws:hover { background: var(--ws-hover); }
  </style>
</head>
<body>

  <header>
    <h1>KAPCHIY</h1>
    <p>Catálogo de Productos</p>
  </header>

  <div class="banner-container">
    <img src="kapchiy-banner.jpg" alt="Banner" class="banner-img" onerror="probarExtensiones(this, ['kapchiy-banner.png', 'kapchiy-banner.jpeg', 'kapchiy-banner.webp'])">
  </div>

  <div class="main-container">
    <div class="catalog" id="catalog"></div>

    <div class="cart">
      <h2>Tu Pedido</h2>
      <div id="cart-items"><p style="color:#888; text-align:center;">El carrito está vacío</p></div>
      <div class="cart-total">
        <span>Total:</span>
        <span id="cart-total">$0</span>
      </div>

      <form onsubmit="enviarWhatsApp(event)">
        <input type="text" id="nombre" placeholder="Nombre completo" required>
        <input type="text" id="direccion" placeholder="Dirección y Ciudad" required>
        <button type="submit" class="btn-ws">Pedir por WhatsApp 💬</button>
      </form>
    </div>
  </div>

  <script>
    // PON TU NÚMERO AQUÍ (Código de país + número, sin espacios ni el signo +)
    const TELEFONO_WHATSAPP = "573000000000";

    const productos = Array.from({ length: 24 }, (_, i) => {
      const num = String(i + 1).padStart(2, '0');
      return {
        id: i + 1,
        nombre: `Modelo Kapchiy ${num}`,
        precio: 150000,
        img: `kapchiy-${num}.jpg`,
        tallas: ["36", "37", "38", "39", "40"]
      };
    });

    let carrito = [];

    // Función para intentar cargar la foto si la extensión es .png, .jpeg, etc.
    function probarExtensiones(img, fallbacks) {
      if (!img.dataset.fallbacks) {
        img.dataset.fallbacks = JSON.stringify(fallbacks);
      }
      let lista = JSON.parse(img.dataset.fallbacks);
      if (lista.length > 0) {
        let siguiente = lista.shift();
        img.dataset.fallbacks = JSON.stringify(lista);
        img.src = siguiente;
      } else {
        img.onerror = null;
        img.src = 'https://via.placeholder.com/200?text=Sin+Imagen';
      }
    }

    function renderizarCatalogo() {
      const catalogEl = document.getElementById('catalog');
      catalogEl.innerHTML = productos.map(p => {
        const num = String(p.id).padStart(2, '0');
        const fallbacks = [
          `kapchiy-${num}.png`,
          `kapchiy-${num}.jpeg`,
          `kapchiy-${num}.WEBP`,
          `kapchiy-${num}.webp`
        ];
        return `
          <div class="card">
            <img src="${p.img}" alt="${p.nombre}" onerror="probarExtensiones(this, ${JSON.stringify(fallbacks)})">
            <h3>${p.nombre}</h3>
            <div class="price">$${p.precio.toLocaleString('es-CO')}</div>
            <select id="size-${p.id}">
              <option value="">Seleccionar Talla</option>
              ${p.tallas.map(t => `<option value="${t}">Talla: ${t}</option>`).join('')}
            </select>
            <button class="btn-add" onclick="agregarAlCarrito(${p.id})">Agregar al Carrito</button>
          </div>
        `;
      }).join('');
    }

    function agregarAlCarrito(id) {
      const select = document.getElementById(`size-${id}`);
      if (!select.value) {
        alert("Selecciona una talla primero.");
        return;
      }
      const p = productos.find(item => item.id === id);
      carrito.push({ ...p, talla: select.value, cartId: Date.now() + Math.random() });
      actualizarCarrito();
    }

    function actualizarCarrito() {
      const itemsEl = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total');

      if (carrito.length === 0) {
        itemsEl.innerHTML = '<p style="color:#888; text-align:center;">El carrito está vacío</p>';
        totalEl.innerText = '$0';
        return;
      }

      itemsEl.innerHTML = carrito.map(item => `
        <div class="cart-item">
          <div>
            <strong>${item.nombre}</strong><br>
            <small>Talla: ${item.talla} - $${item.precio.toLocaleString('es-CO')}</small>
          </div>
          <button class="btn-del" onclick="eliminarDelCarrito(${item.cartId})">✕</button>
        </div>
      `).join('');

      const total = carrito.reduce((sum, item) => sum + item.precio, 0);
      totalEl.innerText = `$${total.toLocaleString('es-CO')}`;
    }

    function eliminarDelCarrito(cartId) {
      carrito = carrito.filter(item => item.cartId !== cartId);
      actualizarCarrito();
    }

    function enviarWhatsApp(e) {
      e.preventDefault();
      if (carrito.length === 0) {
        alert("El carrito está vacío.");
        return;
      }

      const nombre = document.getElementById('nombre').value;
      const direccion = document.getElementById('direccion').value;

      let detalle = carrito.map((item, i) => `${i + 1}. *${item.nombre}* - Talla: ${item.talla} ($${item.precio.toLocaleString('es-CO')})`).join('\n');
      const total = carrito.reduce((sum, item) => sum + item.precio, 0);

      const mensaje = `*PEDIDO KAPCHIY*\n\n👤 *Cliente:* ${nombre}\n📍 *Dirección:* ${direccion}\n\n📦 *Productos:*\n${detalle}\n\n💰 *Total:* $${total.toLocaleString('es-CO')}`;

      window.open(`https://wa.me/${TELEFONO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`, '_blank');
    }

    renderizarCatalogo();
  </script>
</body>
</html>
